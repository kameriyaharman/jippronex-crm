name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: https://api-production-6c83491d.up.railway.app
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../../Jippronex-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jippronex-apk
          path: Jippronex-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Jippronex Android ${{ github.run_number }}
          files: Jippronex-${{ github.run_number }}.apk
          body: Installable APK (connects to the live Railway API).
